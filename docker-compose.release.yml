x-common-volumes: &common-volumes
  - ./:/MoneyPrinterTurbo

services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneyprinterturbo-webui-2
    ports:
      - "127.0.0.1:8502:8501"
    command:
      [
        "streamlit",
        "run",
        "./webui/Main.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--browser.serverAddress=127.0.0.1",
        "--server.enableCORS=True",
        "--browser.gatherUsageStats=False",
        "--server.showEmailPrompt=False"
      ]
    volumes: *common-volumes
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneyprinterturbo-api-2
    ports:
      - "127.0.0.1:8081:8080"
    command: ["python3", "main.py"]
    volumes: *common-volumes
    restart: always